<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do-list</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@300..800&family=Merienda:wght@300..900&display=swap" rel="stylesheet">
</head>
<body>
    <section id="main">
        <div class="container">
            <h1>
                To-do-list 🔥
            </h1>
            <form class="taskForm">
                <div class="imput-area">
                    <input type="text" id="taskImput" placeholder="Digite aqui sua atividade!">
                    <button type="submit">Enviar Atividade</button>
                </div>
                <ul id="taskList"></ul>
            </form>
        </div>
    </section>
</body>
</html>
